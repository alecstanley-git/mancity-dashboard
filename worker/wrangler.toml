name = "mancity-hub-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
account_id = "a89d321ea82e3061ee6ce6d92998b808"

[vars]
# Upstream calls allowed per UTC day. football-data.org limits by the minute
# rather than the day, so this is a backstop against a runaway loop, not a
# quota. It is only enforced when the KV binding below exists.
DAILY_BUDGET = "400"

# Holds the day counter for the upstream request budget, plus a last-known-good
# copy of each response so the site degrades to stale-but-real if upstream goes
# down. The Worker treats this as optional and runs without it.
[[kv_namespaces]]
binding = "HUB_KV"
id = "c16b12e769f94c7b8d7dd295512d3a6b"

# Secrets (never in this file):
#   npx wrangler secret put FOOTBALL_DATA_TOKEN --config worker/wrangler.toml
